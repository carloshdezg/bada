<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F16227" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#14A3BE" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0F1923" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0F1923" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="640" height="520" rx="0" fill="url(#bg)"/>
  <rect width="640" height="520" fill="url(#overlay)"/>

  <!-- Grid texture lines -->
  <line x1="0" y1="130" x2="640" y2="130" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="0" y1="260" x2="640" y2="260" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="0" y1="390" x2="640" y2="390" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="520" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="520" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="520" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Camera icon placeholder -->
  <rect x="284" y="208" width="72" height="58" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <circle cx="320" cy="235" r="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <circle cx="320" cy="235" r="6" fill="rgba(255,255,255,0.3)"/>
  <rect x="296" y="212" width="10" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Label text -->
  <text x="320" y="306" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="16" font-weight="bold"
        fill="rgba(255,255,255,0.90)" letter-spacing="0.5">
    Imagen editorial pendiente
  </text>
  <text x="320" y="332" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13"
        fill="rgba(255,255,255,0.60)" letter-spacing="2">
    TRANSPORTES BADA
  </text>
</svg>
